  # About
  about:
    title: "About CSM Bible Challenge"
    what_is_title: "What is CSM Bible Challenge?"
    what_is_description: "CSM Bible Challenge is a platform for daily Bible reading with friends. Join a reading challenge, track your progress, and encourage one another as you read through the Bible together."
    how_it_works_title: "How it works"
    how_it_works_description: "Join a challenge, receive a daily email with your assigned chapter, read it, and mark it complete. Each day brings a new chapter, keeping everyone on the same page."
