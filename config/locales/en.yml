    statistics_description: "Track your completion percentage, on-time reading rate, and see how you rank on the leaderboard. Group rankings show which teams are keeping up best."
    sprints_title: "Sprints"
    sprints_description: "Sprints are time-bounded periods within a challenge — for example, a month or a quarter. They let you focus on shorter goals and compare group performance across different stretches."
    seven_day_win_title: "Weekly Winner"
    seven_day_win_description: "Every participant who completes 100% of readings in the last 7 days is entered into a drawing. A winner is selected live with a fun animation. It is a weekly incentive to stay consistent."

