      intro_winner: "Die Gruppe mit dem höchsten Abschluss-% gewinnt. Gleichstände sind erlaubt — mehrere Gruppen können gemeinsam gewinnen. Sprints innerhalb einer Challenge dürfen sich nicht überschneiden."
