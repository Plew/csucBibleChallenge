staging:
  # No recurring jobs in staging to prevent emails and other automated tasks

production:
  daily_challenge_summary:
    class: DailyChallengeSummaryJob
    schedule: at 6am every day
  send_daily_reading_emails:
    class: SendDailyReadingEmailsJob
    schedule: every hour
  remove_inactive_users_from_groups:
    class: RemoveInactiveUsersFromGroupsJob
    schedule: at 3am every day
  calculate_sprint_winners:
    class: CalculateSprintWinnersJob
    schedule: at 4am every day
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
