<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <g opacity="0.8">
    <!-- TOP-LEFT CLUSTER -->
    <!-- Gold base -->
    <ellipse cx="0" cy="0" rx="350" ry="280" fill="#C79C46" opacity="0.35" />
    <!-- Olive overlap -->
    <ellipse cx="-50" cy="300" rx="250" ry="350" fill="#8A9575" opacity="0.3" />
    <!-- Subtle curved line accent -->
    <path d="M -50 50 Q 300 50 250 350 T -100 600" stroke="#C79C46" stroke-width="1.5" fill="none" opacity="0.4" />

    <!-- MID-RIGHT CLUSTER -->
    <!-- Light beige/gold top -->
    <ellipse cx="1440" cy="150" rx="380" ry="300" fill="#E6D3A3" opacity="0.4" />
    <!-- Main dark olive sweep -->
    <ellipse cx="1500" cy="550" rx="350" ry="450" fill="#6B7558" opacity="0.45" />
    <!-- Subtle curved line accent -->
    <path d="M 1440 -50 Q 1050 150 1100 500 T 1440 1000" stroke="#8A9575" stroke-width="1.5" fill="none" opacity="0.4" />

    <!-- BOTTOM-LEFT CLUSTER -->
    <ellipse cx="50" cy="950" rx="280" ry="220" fill="#A3B18A" opacity="0.3" />
  </g>
</svg>
