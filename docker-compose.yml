# Docker Compose for development
# Usage: bin/docker-dev up

name: hiegra-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code with caching for macOS performance
      - .:/app:cached
      # Use named volumes for dependencies (avoids macOS performance issues)
      - bundle_cache:/usr/local/bundle
      - node_modules:/app/node_modules
      # Mount storage directly so bin/pull_prod_db works from host
      - ./storage:/app/storage
    environment:
      - RAILS_ENV=development
      - NODE_ENV=development
      - BINDING=0.0.0.0
      # For Chromium-based tests
      - CHROME_BIN=/usr/bin/chromium
      - CHROMIUM_BIN=/usr/bin/chromium
    stdin_open: true
    tty: true
    depends_on:
      - redis

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  bundle_cache:
    name: hiegra_bundle_cache
  node_modules:
    name: hiegra_node_modules
  redis_data:
    name: hiegra_redis_data
